name: C++ CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'NativeCV/**'
  workflow_dispatch:

jobs:
  build-cpp:
    name: Build Android shared library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and extract OpenCV Android SDK
        run: |
          wget -O opencv.zip https://github.com/opencv/opencv/releases/download/4.12.0/opencv-4.12.0-android-sdk.zip
          unzip -q opencv.zip -d $HOME/tools
          echo "OpenCV_DIR=$HOME/local/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c

      - name: Configure CMake
        working-directory: NativeCV
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DOpenCV_DIR=${{ env.OpenCV_DIR }}

      - name: Build library
        working-directory: NativeCV
        run: cmake --build build --config Release